  # ---------------------------------------------------------------------------
  # EURUSD.pa — Forex major, cuenta Pro (comision 4.5 round-trip)
  # ---------------------------------------------------------------------------
  - ticker_axi: "EURUSD.pa"    # cuenta real Axi-US51-Live (.pa = FX/metal); confirmar en Select activa
    ticker_cascade: "EURUSD"
    category: "forex"
    eligible_for_allocation: true
    quote_currency: "USD"
    contract_size: 100000
    tick_size: 0.00001           # 5 digitos
    pip_size: 0.0001             # 1 pip = 10 ticks (fractional pip forex)
    tick_value_usd: 1.0          # 1 tick × 100k contract = $1 per lote
    point_value_usd: 100000.0    # contract 100k x quote USD
    min_lot: 0.01
    lot_step: 0.01
    max_lot: 100.0
    typical_spread_points: 2     # AXI daily <SPREAD> mediana=2 (script MT5, export 2026-06-24, n=215 barras con dato). UNIDADES MT5 (points=1e-5); NO lo usa SQX
    worst_spread_points: 20      # conservador: snapshot diario AXI plano (=2), no capta spikes intradía
    sqx_hp_spread_points: 0.5    # UNIDADES SQX (pips): crosscheck RetestWithHigherPrecision. Decision usuario 2026-09-28 (CP eurusd_h4_robustez)
    sqx_mc_spread_range: [1, 2.5]  # UNIDADES SQX (pips): MC_Execution_Realism RandomizeSpread Min/Max. Decision usuario 2026-09-28
    sqx_mc_slippage_range: [0.5, 2]  # UNIDADES SQX (pips): MC_Execution_Realism RandomizeSlippage Min/Max. Decision usuario 2026-09-28
    commission_usd_per_lot_per_side: 2.25   # 4.5 round-trip (plataforma AXI Select) ⇒ 2.25/lado; SQX SizeBased=4.5
    swap_type: "points"
    swap_long_value: -6.93       # refrescado 2026-06-20 (era -7.7)
    swap_short_value: 3.87       # refrescado 2026-06-20 (era 4.05)
    triple_swap_day: "wednesday"  # convencion forex spot T+2
    sessions_broker_est7:        # EST+7. Fuente: export MT5 2026-06-20
      mon_thu: {open: "00:01", close: "23:59"}
      fri: {open: "00:01", close: "23:58"}
    stop_level_points: 0.1       # refrescado 2026-06-20 (era 1)
    margin_currency: "USD"
    leverage_max: 1000           # demo Axi-US50
    notes: |
      Cuenta Pro: spread tight ECN + comision 4.5 USD/lote/lado.
      Spread tipico AXI Pro EURUSD ~0.0-0.2 pips = 0-20 points (referencia externa).
      Valores typical/worst pendientes de captura empirica.

