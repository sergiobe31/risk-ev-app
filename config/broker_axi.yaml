# Specs por simbolo de AXI Select (cuenta demo MT5, tier Pro).
#
# Capturas obtenidas de la pantalla de Especificacion de cada simbolo en MT5
# demo AXI Select. Spreads de BTC/ETH derivados de stats 2024-2026 sobre
# datos historicos descargados (mediana / P95).
#
# Reconciliado 2026-06-20 contra el export del script MT5 de SQX
# (Update_SQX_Instruments_information, servidor Axi-US50-Demo) via
# scripts/diagnostics/reconcile_broker_yaml.py. Hechos duros (tick/lote/contrato/
# swap/sesiones) refrescados del broker; spreads historicos/ticker_cascade/
# eligibility/notes preservados.
#
# Convenciones:
# - swap_type "percent_open_price" / "percent_current_price": valor anualizado
#   (e.g. -20.0 = -20%). MT5 lo aplica como (valor / 360) * nominal por noche.
# - swap_type "points": valor fijo de swap por noche en points.
# - typical_spread_points/worst_spread_points: valores en "points" tal cual los
#   reporta MT5 (multiplicar por tick_size para USD).
# - commission_usd_per_lot_per_side: medio coste de comision por lote. AXI Select
#   cobra 4.5 USD/lote por ROUND-TRIP, facturado INTEGRO EN LA ENTRADA (0 en salida);
#   lo modelamos como 2.25/lado para que round_trip = 2 * 2.25 = 4.5 = coste real.
#   En SQX -> "Size based" = 4.5 (round-trip), NUNCA "Per trade". Indices/cripto (.sa) = 0,
#   FX/metal (.pa, cuenta Pro) = 2.25. Confirmado por usuario 2026-06-24.
# - point_value_usd: USD por 1.0 de movimiento de precio por 1.0 lote =
#   contract_size * (cotizacion -> USD). CALCULADO (el export trae bugs de
#   conversion: XML doble-convierte indices fx; CSV da basura en USDxxx).
# - sessions_broker_est7: horario en HORA SERVIDOR AXI (EST+7), NO UTC.
#
# Pendientes per-simbolo marcados con TODO.

broker: "Axi Select MT5 demo (Pro)"
account_tier: "pro"
captured_at: "2026-05-23"
reconciled_at: "2026-06-20"

