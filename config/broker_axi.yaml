# Update_SQX_Instruments_information):
#     EURUSD.pa  ·  ETHUSD.sa  ·  XAUUSD.pa  ·  NZDUSD.pa
# Se BORRARON los no-seed (USTECH.sa, USDCHF.pa, AUS200.sa) para mantenerlo
# minimo; sus specs viven en el historial de git (commit previo a 2026-06-24)
# y se recapturan del script MT5 cuando se necesite rotar un slot.
# Fuente de verdad de la decision: la lista de tickers de la cuenta Seed (2026-06-24).
# ---------------------------------------------------------------------------

