# Perfiles de prop firms para el simulador EV (risk_app, pagina Prop Firms).
#
# Enfoque EXTRACTIVO: el challenge es un juego de valor esperado —
#   EV/intento = -fee + P(P1 ∧ P2) × E[payouts fondeada | P1 ∧ P2]
#
# VERIFICADO contra ftmo.com (Trading Objectives, FAQs, Scaling Plan) 2026-07-27:
# - max_loss_pct: ESTATICO (inicial x (1 - pct)), breach sobre EQUITY (flotante
#   incluido), en Challenge, Verification y fondeada. Conforme en el motor.
# - max_daily_loss_pct: suelo = balance a 00:00 CE(S)T - pct% del balance
#   INICIAL, recalculado cada medianoche; breach sobre equity. Conforme.
# - min_trading_days: dias CE(S)T con >= 1 posicion ABIERTA; NO aplica en la
#   fondeada. Conforme.
# - profit target: sobre balance CERRADO (todas las posiciones cerradas).
#   Conforme.
#
# APROXIMACIONES / NO MODELADO (conservador salvo indicacion):
# - Payouts reales: "dia 14 o posterior al primer trade" y luego on-demand;
#   el modelo usa ciclos fijos de payout_cycle_days (retrasa flujo de caja).
# - Rollover (dejar el reward en cuenta para colchon, min $20) no modelado:
#   el modelo asume retirada total y reset al tamano inicial.
# - Scaling Plan (>=4 meses, >=10% neto total, >=2 payouts -> split 90% y
#   +25% balance/4 meses, tope $2M) no modelado: split fijo del 80%.
# - Fondeada STANDARD: restriccion de noticias (±2 min; SL/TP que salte en la
#   ventana = breach) y cierre obligatorio antes del fin de semana / pausas
#   >2h. NO modeladas -> el motor SOBREESTIMA la supervivencia de la
#   fondeada. Cuentas Swing exentas (producto no modelado aqui).
# - El 1-Step es OTRO producto (daily 3%, max loss trailing EOD, Best Day
#   Rule 50%, split 90% fijo, fee NO reembolsable): no mezclar sus reglas.
#
# Convenciones:
# - account_size en USD (moneda de la cuenta de la firm).
# - fee en la moneda indicada por fee_ccy (default EUR, moneda real del
#   trader; la conversion USD->EUR de los payouts se aplica en la UI via
#   fx_eur_usd). Con fee_ccy: USD, resolve_fee_eur() la normaliza a EUR
#   UNA vez en el setup antes de tocar el motor.
# - funded.payout_cycle_days: dias calendario entre payouts (aprox.; ver
#   arriba). Solo aplica a funded.model "cycle" (FTMO).
# - funded.max_payout_cycles: cap de TRUNCADO de la simulacion (50 ~ 2 anos;
#   se reporta alive_at_cap y la cota del sesgo), no es una regla de FTMO.

firms:
  ftmo_50k:
    display_name: "FTMO Challenge 50k"
    company: "FTMO"
    account_size: 50000
    fee: 345
    profit_split_pct: 80        # escala a 90 con volumen; editable en UI
    refund_fee_on_first_payout: true
    phases:
      - name: "Challenge"
        profit_target_pct: 10
        max_daily_loss_pct: 5
        max_loss_pct: 10
        min_trading_days: 4
      - name: "Verification"
        profit_target_pct: 5
        max_daily_loss_pct: 5
        max_loss_pct: 10
        min_trading_days: 4
    funded:
      payout_cycle_days: 14
      min_payout_profit_pct: 0
      max_payout_cycles: 50

  ftmo_50k_swing:
    display_name: "FTMO Challenge 50k Swing"
    company: "FTMO"
