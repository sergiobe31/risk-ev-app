  # -------------------------------------------------------------------------
  # Apex 150K Intraday Trail (4.0) — spec verificada sept-2026
  # (docs/referencia/APEX_150K_Reglas_Motor_de_Riesgo-2.md; plan adjudicado Fase 1).
  #
  # Bloques nuevos respecto a FTMO (todos opcionales; defaults = FTMO):
  # - ruleset_version: Apex rota reglas; re-verificar por ciclo.
  # - fee_ccy: EUR (default) | USD. Con USD, resolve_fee_eur normaliza el fee
  #   a EUR UNA vez en el setup (fx del request) — no por touchpoint.
  # - activation: fee de activacion de la PA (solo en paths pass).
  # - day_axis: "et_session" = sesiones CME 18:00->16:59 ET (Fase 0);
  #   ausente = dia calendario (FTMO).
  # - phases[].drawdown: trailing intradia unrealized (exige max_loss_pct:
  #   null). phases[].max_daily_loss_pct / max_loss_pct ahora anulables
  #   (0.0 queda PROHIBIDO por el loader). lifetime_days = reloj de dias
  #   NATURALES; on_horizon_exhausted: "fail" = expirar cuesta el fee
  #   (outcome "expired"); "exclude" = default FTMO.
  # - phases[].max_contracts: cap de contratos simultaneos de la evaluacion
  #   (Fase 5; diagnostico contract_cap_diagnostic en micro-equivalentes,
  #   1 mini = 10 micros). El cap de la PA sale de funded.scaling_tiers.
  # - funded.model: "cycle" (default FTMO) | "ladder" (exige bloque payouts).
  # - funded.drawdown con lock_at_balance/frozen_floor: suelo congelado.
  # - funded.daily_loss: pausa no fatal por sesion, DLL por tier,
  #   post_hit: clamp (PnL sesion := min(observado, -DLL)).
  # - funded.scaling_tiers: caps de contratos por tramo de beneficio.
  # - funded.payouts: escalera de retiros; residual_floor = safety net bajo
  #   el que nunca se retira; min_balance_first >= residual + min_payout.
  # - funded.inactivity: ventana rolling de dias naturales con minimo de
  #   dias activos con beneficio >= min_profit_usd.
  # -------------------------------------------------------------------------
  apex_150k_intraday:
    display_name: "Apex 150K Intraday Trail (4.0)"
    company: "Apex"
    ruleset_version: "apex_4.0_verified_2026-09"
    account_size: 150000
    fee: 49.80
    fee_ccy: USD                    # el loader normaliza a EUR UNA vez (fx del request);
    profit_split_pct: 100           #   internamente cfg.fee queda en EUR → ev_vector_all,
    refund_fee_on_first_payout: false   #   refund, stop_on_insolvency y FTMO intactos
    activation: {fee_usd: 59, deadline_days: 7}   # convertida igual; solo en paths pass
    day_axis: et_session            # Fase 0; FTMO: default actual
    phases:
      - name: "Evaluation"
        profit_target_pct: 6.0
        min_trading_days: 0
        max_daily_loss_pct: null    # null = sin DLL (0 queda PROHIBIDO por el loader)
        max_loss_pct: null          # barrera estática desactivada; manda el drawdown
        drawdown: {type: trailing_intraday_unrealized, amount_usd: 4000}
        lifetime_days: 30           # días NATURALES (reloj = durations+gaps wall-clock)
        on_horizon_exhausted: fail  # expirar = fee perdido; outcome nuevo "expired"
        max_contracts: {max_mini: 12, max_micro: 120}   # cap de contratos simultáneos (Fase 5; suma cross-instrumento en micro-eq)
    funded:
      model: ladder                 # FTMO: "cycle" (default)
      drawdown: {type: trailing_intraday_unrealized, amount_usd: 4000,
                 lock_at_balance: 154100, frozen_floor: 150100}
      daily_loss: {type: pause_not_fatal, reset: session,
                   by_tier_usd: [2500, 2500, 2500, 3000, 4000],
                   post_hit: clamp} # PnL sesión := min(observado, −DLL); ver Fase 4
      scaling_tiers:
        - {level: 1, profit_range: [0, 1999],    max_mini: 4,  max_micro: 40}
        - {level: 2, profit_range: [2000, 2999], max_mini: 5,  max_micro: 50}
        - {level: 3, profit_range: [3000, 4999], max_mini: 7,  max_micro: 70}
        - {level: 4, profit_range: [5000, 9999], max_mini: 10, max_micro: 100}
        - {level: 5, profit_range: [10000, null], max_mini: 10, max_micro: 100}
      payouts:
        qualifying_day_min_usd: 300
        days_per_payout: 5
        ladder_usd: [2500, 3000, 3000, 4000, 4000, 5000]
        min_payout_usd: 500
        min_balance_first: 154600
        residual_floor: 154100
        max_payouts: 6
        consistency: {max_best_day_share: 0.50, strict: true, window: since_last_payout}
      inactivity: {window_days: 30, min_days: 2, min_profit_usd: 50}
      max_payout_cycles: 50         # cap de TRUNCADO de simulación (no regla Apex)

  # -------------------------------------------------------------------------
  # FTMO Futures (Pro/Growth) — ruleset_version: ftmo_futures_verified_2026-09-29
  # (skill propfirm-sim: ruleset verificado en ftmo.com 2026-09-29 + blog + FAQ).
  #
  # Mecánicas nuevas respecto a los perfiles anteriores:
  # - day_axis_cut_hhmm "16:10": día-regla 18:00 ET → 16:10 ET del día siguiente
  #   (el corte es exclusivo por arriba: el ts 16:10 ya etiqueta al día N+1;
  #   la última barra M1 del día-regla es la 16:09). Apex sigue en "18:00".
  # - fee: 0 + bloque subscription: suscripción mensual cancelada al pasar;
  #   breach de eval → cuenta nueva GRATIS en la siguiente fecha de facturación;
  #   reset de pago opcional reinicia sin esperar (no altera el ciclo de
  #   facturación, anclado a t=0). El fee-único por intento de FTMO CFD/Apex
  #   NO aplica: el coste de un breach es TIEMPO (mensualidades), no un fee nuevo.
  # - drawdown eod_trailing: umbral recalculado al INICIO del día desde
  #   max(cierres de balance anteriores, inicial) − amount; breach sobre EQUITY
  #   intradía ("at any point", balance + flotante − comisiones). lock_at_balance
  #   es el CAP del umbral (= inicial → lock permanente).
  # - daily_loss_usd (eval Pro, hard fatal) / funded.daily_loss (Pro hard /
  #   Growth soft = cierra todo y suspende el día, cuenta viva).
  # - consistency (solo eval, puerta de pase NUNCA de breach): "Best Day 40%
  #   or less" = inclusiva (strict: false); el pase se retrasa hasta cumplirla.
  # - payouts_futures: qualifying days sobre P&L cerrado EOD; retirable =
  #   withdraw_share × profit sobre el INICIAL; regla min-new-profit (≥50% de lo
  #   solicitado = profit nuevo del ciclo); request_cap por request; ratio 90/10
  #   sobre lo solicitado (profit_split_pct).
  #
  # Caveats ligados a ruleset_version (plan v2):
  # - C4: "Beta phase" solo consta en el blog de lanzamiento (NO en la página
  #   de reglas); FTMO promete no cambiar reglas retroactivamente en cuentas
  #   activas. Pro "Withdraw 100% of your profit" (landing) = FRACCIÓN
  #   RETIRABLE del profit (el ratio 90/10 aplica sobre lo solicitado,
  #   adjudicado 2026-09-29). Si el "100%" del blog fuera promoción futura de
  #   RATIO, re-verificar.
  # - C1: campaign_cap_days (183) / funded_cap_days (365) / max_payout_cycles
  #   son horizontes de TRUNCADO del modelo (decisión de diseño 2026-09-29), NO
  #   reglas FTMO — se reportan p_truncated / alive_at_cap.
  # - C2: el breach de equity usa rel_low GROSS de comisiones → chequeo
  #   levemente optimista (ligado a ruleset_version, mismo caveat que Apex).
  # - funded.scaling_tiers (escalado de contratos por profit EOD): tablas
  #   completas NO verificadas (pendiente de verificar) → diagnóstico sin
  #   veto; el cap de eval queda en phases[].max_contracts.
  # -------------------------------------------------------------------------
  ftmo_futures_growth_50k:
    display_name: "FTMO Futures Growth 50K"
    company: "FTMO"
    ruleset_version: ftmo_futures_verified_2026-09-29
    account_size: 50000
