name: ci

# En cada push y PR desde 2026-11-04: el repo es público y GitHub Actions no gasta cuota en repos públicos. Entre
# el 2026-10-28 y esa fecha, con el repo privado, solo se lanzaba a mano (cada ejecución en macOS + Windows gastaba
# unos 100-150 minutos de la cuota). "main protegida" exige esta CI verde en los PRs.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python 3.11 en ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Primero el camino del README (solo requirements.txt + smoke); despues las de desarrollo y los tests.
      - name: Instalar dependencias de la app
        run: python -m pip install -r requirements.txt
      - name: Smoke de la app (demo sintetica)
        run: python run_app.py --smoke --strict
      - name: Instalar dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q

  front:
    name: Front (Node 22) en ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: poc_web/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: poc_web/web/package-lock.json
      - run: npm ci
      - run: npm run build
